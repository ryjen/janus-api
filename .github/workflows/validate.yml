name: Janus validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_private:
        description: Explicitly authorize a private GitHub-hosted build
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-and-test:
    # Avoid spending GitHub-hosted minutes on a private portfolio source by default.
    if: ${{ github.event.repository.private == false || (github.event_name == 'workflow_dispatch' && inputs.run_private) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      # AWS SAM CLI 1.168.0 requires cfn-lint >=1.52,<1.54. Our separate
      # source lint pins 1.57.2; putting both in one venv cannot resolve.
      - name: Install isolated SAM and CloudFormation validation tools
        run: |
          python3 -m venv .sam-venv
          .sam-venv/bin/python -m pip install 'aws-sam-cli==1.168.0'
          .sam-venv/bin/python -m pip check
          python3 -m venv .lint-venv
          .lint-venv/bin/python -m pip install 'cfn-lint==1.57.2'
          .lint-venv/bin/python -m pip check
      - name: Build, test, and package Lambda artifacts without deployment
        run: |
          export PATH="$PWD/.sam-venv/bin:$PATH"
          SAM_CLI_TELEMETRY=0 ./build.sh
      - name: Validate infrastructure contract (no deployment)
        run: |
          .lint-venv/bin/cfn-lint template.yaml
          .lint-venv/bin/python -m unittest discover -s tests -p 'test_template.py'
