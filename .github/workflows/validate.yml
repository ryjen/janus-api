name: Janus validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    # No GitHub-hosted minutes are consumed while this portfolio source is private.
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore, build, and test
        run: |
          dotnet restore janus.sln
          dotnet build janus.sln --no-restore --configuration Release
          dotnet test tests/janus.tests.csproj --configuration Release
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Validate Serverless configuration without deploying
        env:
          API_KEY: example-local-never-deploy
        run: |
          npm ci
          npx serverless print --stage sandbox
