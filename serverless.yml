service: janus
# app and org for use with dashboard.serverless.com
#app: your-app-name
#org: your-org-name

configValidationMode: error

# You can pin your service to only deploy with a specific Serverless version
# Check out our docs for more details
#frameworkVersion: "3"

useDotenv: true

package:
  individually: true

provider:
  name: aws
  runtime: dotnet10

  stage: dev
  region: ca-central-1
  environment:
    ACCOUNT_TABLE: !Ref AccountTable
    PLAYER_TABLE: !Ref PlayerTable

  apiGateway:
    apiKeySourceType: HEADER
    apiKeys:
      - name: "janus-api-key"
        value: ${env:API_KEY}

  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DescribeTable
            - dynamodb:DeleteItem
          Resource:
            - Fn::Sub: "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${self:service}-${sls:stage}-Account"
            - Fn::Sub: "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${self:service}-${sls:stage}-Player"
        - Effect: Allow
          Action:
            - cognito-idp:AdminInitiateAuth
            - cognito-idp:AdminCreateUser
            - cognito-idp:AdminRespondToAuthChallenge
          Resource:
            - Fn::GetAtt: ["AccountPool", "Arn"]
        - Effect: Allow
          Action:
            - sqs:sendmessage
          Resource:
            - Fn::GetAtt: ["JanusQueue", "Arn"]

functions:
  auth:
    handler: GameplayDataSystem::Janus.Auth::Handler
    events:
      - http:
          path: /authenticate
          method: post
          cors: true
          private: true
      - http:
          path: /reset
          method: post
          cors: true
          private: true
      - http:
          path: /signup
          method: post
          cors: true
          private: true
    environment:
      USER_POOL_ID: !Ref AccountPool
      CLIENT_ID: !Ref AccountPoolClient
      QUEUE_URL: !Ref JanusQueue

    package:
      artifact: bin/Release/net10.0/auth.zip

  account:
    handler: GameplayDataSystem::Janus.Account::Handler
    events:
      - http:
          path: /account
          method: get
          cors: true
          private: true
          authorizer:
            name: JanusCognitoAuthorizer
            type: COGNITO_USER_POOLS
            arn:
              Fn::GetAtt: [AccountPool, Arn]
      - http:
          path: /account
          method: delete
          cors: true
          private: true
          authorizer:
            name: JanusCognitoAuthorizer
            type: COGNITO_USER_POOLS
            arn:
              Fn::GetAtt: [AccountPool, Arn]
    package:
      artifact: bin/Release/net10.0/account.zip

  player:
    handler: GameplayDataSystem::Janus.Player::Handler
    events:
      - http:
          path: /player
          method: post
          cors: true
          private: true
          authorizer:
            name: JanusCognitoAuthorizer
            type: COGNITO_USER_POOLS
            arn:
              Fn::GetAtt: [AccountPool, Arn]
      - http:
          path: /player
          method: put
          cors: true
          private: true
          authorizer:
            name: JanusCognitoAuthorizer
            type: COGNITO_USER_POOLS
            arn:
              Fn::GetAtt: [AccountPool, Arn]
      - http:
          path: /player
          method: get
          cors: true
          private: true
          authorizer:
            name: JanusCognitoAuthorizer
            type: COGNITO_USER_POOLS
            arn:
              Fn::GetAtt: [AccountPool, Arn]
      - http:
          path: /player
          method: delete
          cors: true
          private: true
          authorizer:
            name: JanusCognitoAuthorizer
            type: COGNITO_USER_POOLS
            arn:
              Fn::GetAtt: [AccountPool, Arn]
    package:
      artifact: bin/Release/net10.0/player.zip

  accountProvision:
    handler: GameplayDataSystem::Janus.Account::Provision
    events:
      - sqs:
          arn:
            Fn::GetAtt: [JanusQueue, Arn]
    package:
      artifact: bin/Release/net10.0/account.zip

resources:
  Resources:
    AccountTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-${sls:stage}-Account
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        ProvisionedThroughput:
          ReadCapacityUnits: 5
          WriteCapacityUnits: 5

    PlayerTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-${sls:stage}-Player
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        ProvisionedThroughput:
          ReadCapacityUnits: 5
          WriteCapacityUnits: 5

    JanusQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:service}-${sls:stage}-queue
        RedrivePolicy:
          deadLetterTargetArn: !GetAtt JanusDeadLetterQueue.Arn
          maxReceiveCount: 5

    JanusDeadLetterQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:service}-${sls:stage}-dead-letter

    AccountPool:
      Type: AWS::Cognito::UserPool
      Properties:
        UserPoolName: ${self:service}-${sls:stage}-pool
        Policies:
          PasswordPolicy:
            MinimumLength: 8
            RequireUppercase: true
            RequireLowercase: true
            RequireNumbers: true
            RequireSymbols: true
        Schema:
          - AttributeDataType: String
            Name: email
            Required: true
        AutoVerifiedAttributes: ["email"]
        MfaConfiguration: OFF
        SmsAuthenticationMessage: "Your verification code is {####}"
        SmsVerificationMessage: "Your verification code is {####}"
        EmailVerificationMessage: "Your verification code is {####}"
        EmailVerificationSubject: "Verify your email for our awesome app!"
        UsernameAttributes:
          - email

    AccountPoolClient:
      Type: AWS::Cognito::UserPoolClient
      Properties:
        ClientName: ${self:service}-${sls:stage}-pool-client
        UserPoolId:
          Ref: AccountPool
        GenerateSecret: false
        ExplicitAuthFlows:
          - "ADMIN_NO_SRP_AUTH"


custom:
  local:
    stage: local
    dynamodb:
      stages:
        - local
    lambda:
      stages:
        - local
  serverless-offline:
    httpPort: 3000
    stage: local
    apiKey: ${env:API_KEY}

plugins:
  - serverless-offline
  - serverless-local
  - serverless-version-tracker
  - serverless-offline-local-authorizers-plugin
